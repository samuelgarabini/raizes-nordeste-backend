spring:
  application:
    name: raizes-nordeste-backend

  datasource:
    url: jdbc:postgresql://postgres:5432/raizes_db
    username: raizes_app
    password: secret_password

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html