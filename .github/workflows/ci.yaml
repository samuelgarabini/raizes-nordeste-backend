name: Continuous Integration Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    env:
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/raizes_db
      SPRING_DATASOURCE_USERNAME: raizes_app
      SPRING_DATASOURCE_PASSWORD: secret_password
      SPRING_REDIS_HOST: localhost
      SPRING_RABBITMQ_HOST: localhost
      JPA_SHOW_SQL: "false"

      # Valores exclusivos do ambiente automatizado de testes.
      JWT_SECRET: >-
        ci-only-jwt-secret-with-at-least-32-bytes-do-not-use
      DATA_ENCRYPTION_KEY: >-
        MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      DATA_FINGERPRINT_KEY: >-
        ZmVkY2JhOTg3NjU0MzIxMGZlZGNiYTk4NzY1NDMyMTA=

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: raizes_db
          POSTGRES_USER: raizes_app
          POSTGRES_PASSWORD: secret_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U raizes_app -d raizes_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Build with Maven
        run: mvn -B package --file pom.xml -DskipTests

      - name: Run unit and integration tests
        run: mvn -B test --file pom.xml

      - name: Build Docker image
        run: docker build -t raizes-backend:${{ github.sha }} .